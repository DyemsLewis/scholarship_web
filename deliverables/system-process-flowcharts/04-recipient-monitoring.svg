  <text x="82" y="970" text-anchor="start" fill="#425774" font-family="Aptos, Segoe UI, sans-serif" font-size="14" font-weight="400"><tspan x="82" dy="0">A low or missing grade does not automatically terminate support. The provider records a review, considers circumstances, and documents the next action.</tspan></text>
